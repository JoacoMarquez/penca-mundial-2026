<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>{% block title %}Penca Clausura 2026{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta http-equiv="refresh" content="60">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-4">

  <header class="bg-slate-800/80 backdrop-blur sticky top-0 z-10 border-b border-slate-700">
    <div class="max-w-7xl mx-auto px-4 lg:px-6 py-3 flex items-center justify-between">
      <span class="text-base lg:text-lg font-bold">🇺🇾 Penca Clausura 2026 <span class="text-slate-400 font-normal text-sm">· Supermatch</span></span>
      <span class="text-xs text-slate-400" id="updatedAt"></span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-3 lg:p-6">
    {% block content %}{% endblock %}
  </main>

  <script>
    const u = document.getElementById('updatedAt');
    if (u) u.textContent = new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
  </script>
</body>
</html>
