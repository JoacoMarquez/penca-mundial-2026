# Mundial 2026 — 48 selecciones, 12 grupos.
# Sorteo realizado el 2025-12-05 en Washington DC.
#
# Campos por equipo:
#   name      — nombre en español (display)
#   code      — código FIFA de 3 letras (autoritativo)
#   group     — A..L
#   elo_seed  — Elo aproximado a 2026-Q1; el scraper sobrescribe en runtime desde eloratings.net
#   confed    — CONMEBOL / UEFA / AFC / CAF / CONCACAF / OFC
#
# IMPORTANTE: elo_seed es solo fallback. La pipeline siempre intenta obtener el Elo
# en vivo antes de modelar. Si el scraper de Elo cae, este valor mantiene el sistema operativo.

groups:
  A:
    - { name: "México",          code: MEX, elo_seed: 1850, confed: CONCACAF }
    - { name: "Sudáfrica",       code: RSA, elo_seed: 1640, confed: CAF }
    - { name: "Corea del Sur",   code: KOR, elo_seed: 1740, confed: AFC }
