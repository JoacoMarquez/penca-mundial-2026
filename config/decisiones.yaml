# Registro de decisiones medidas del Clausura.
#
# POR QUÉ EXISTE. El 2026-08-11 descubrimos que el tamaño del menú (K_EV=3) había
# quedado obsoleto: se eligió midiendo bien —+$9.737 ± 859, 16/16 reps— pero a 2.400
# sorteos, y cuando subimos a 19.200 la respuesta correcta pasó a ser 5 sin que nadie
# volviera a preguntar. Costaba ~$8.500 y lo encontramos tres días después, de casualidad.
#
# Una decisión bien tomada puede vencer cuando cambia algo de lo que dependía, y no avisa.
# Este archivo hace que avise: cada decisión declara BAJO QUÉ SUPUESTOS se midió, y
# tests/test_decisiones_vigentes.py falla cuando esos supuestos ya no son los de producción.
#
# NO re-mide nada — eso cuesta horas. Solo grita "esto se decidió en otro mundo".
#
# CÓMO AGREGAR UNA DECISIÓN: cualquier constante que se eligió COMPARANDO alternativas
# con Monte Carlo va acá. Las que son criterio de diseño (MARKET_WEIGHT 70/30) o
# restricción externa (PUNTOS_ESPECIAL=25) no, porque no vencen con el ruido.
#
# CÓMO SE APAGA LA ALARMA: re-medir y actualizar `medida_con`; o declarar `vencida:`
# con el motivo, que la deja pasar pero visible en el listado. `inerte:` es para
# decisiones que hoy no tienen efecto (el código está pero no se ejecuta).
#
# RECHAZOS: un experimento que se midió y NO cambió nada también va acá — es la forma
# de que no se vuelva a intentar por intuición. Se marca con `donde: (nada — ...)`, que
# saltea la verificación contra el código porque no hay valor que verificar.

decisiones:
  - nombre: tamaño del menú de candidatos
    donde: src.clausura.strategy.K_EV
    valor: 5
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "+$8.531 ± 10 (control) · +$9.481 ± 106 (Q calibrada), 3 reps pareadas"
    fecha: 2026-08-11
    nota: >-
      Meseta de 5 a 8 (indistinguibles); 10 mide −$1.532 ± 428 en el control. Todo el
      valor está en 3→5. El óptimo SUBE con los sorteos: a 2.400 el menú de 5 medía
      −$4.192. Si se bajan los sorteos, esta decisión se da vuelta.

  - nombre: rama de hueco del menú
    donde: src.clausura.strategy.K_HUECO
    valor: 0
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "(3,3) mide −$1.505 a +$1.712 según el chalk, siempre debajo de (5,0)"
    fecha: 2026-08-11
    nota: >-
      Lo que sirve es más candidatos por E[pts], no por rareza — distinto de lo que
      suponíamos al escribir la rama.

  - nombre: métrica de orden de la rama de hueco
    donde: src.clausura.strategy.HUECO_METRIC
    valor: legacy_hueco
    medida_con: {sims: 2400, participaciones: 12}
    resultado: "mispricing mide −$9.486 ± 2.154 (12 reps, negativo en 10/12)"
    fecha: 2026-08-08
    inerte: >-
      K_HUECO=0 desde el 8/8: la rama no se ejecuta. Medida en el régimen viejo, pero
      no puede hacer daño mientras siga apagada. Re-medir SOLO si se reactiva la rama.

  - nombre: concentración del pool (chalk)
    donde: src.clausura.pool.PoolConfig.chalk_strength
    valor: 2.2
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "+$1.185 ± 140 (control) por sí sola; +$8.531 junto con el menú"
    fecha: 2026-08-11
    nota: >-
      Calibrada contra 4.791 picks reales (log-loss LOMO 2,2712 → 2,1666) pero funciona
      como PERILLA DE DIFERENCIACIÓN, no como creencia: gana también cuando la verdad
      del pool es la Q vieja. Meseta ancha entre 1,5 y 3,0. La concentración efectiva
      es chalk/temperature — ver el guardrail en picks.py.

  - nombre: sorteos del Monte Carlo
    donde: deploy/clausura-picks.service --sims
    valor: 19200
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "2.400 → 9.600 +$21.060 ± 936 · 9.600 → 19.200 +$1.452 ± 401"
    fecha: 2026-08-10
    nota: >-
      La curva satura (21k → 1,4k por duplicación). El techo era la MEMORIA del droplet,
      destrabada con tres reducciones + el pase a 2 GB. Pico real 575 MB de 1.967.
      ESTE es el supuesto del que cuelgan casi todas las demás decisiones.

  - nombre: pasadas del ascenso por coordenadas
    donde: src.clausura.strategy.build_portfolio(max_passes=)
    valor: 6
    medida_con: {sims: 19200, participaciones: 12}
    resultado: >-
      dos mediciones independientes: barrido directo +$778 a +$873 (control), y los
      reruns warm-starteados +$1.071 de media sobre la planilla de la mañana (8/8
      positivos, SE 110-180)
    fecha: 2026-08-11
    nota: >-
      El "3→6 es 85% overfitting" del 8/8 se midió explícitamente SIN subir sorteos y
      quedó vencido. Primero NO se cambió (efecto ~1,9 SE en el barrido directo), hasta
      que el experimento del umbral lo confirmó por otro camino: el rerun encontraba
      ~$1.000/día porque warm start + 3 pasadas ≡ 6 pasadas en frío. Subirlo captura
      eso en la corrida de la mañana, sin recargas manuales. Costo: ~7 min más de CPU.

  - nombre: goleador dentro del Monte Carlo
    donde: src.clausura.picks.GOLEADOR_EN_MC
    valor: false
    medida_con: {sims: 9600, participaciones: 12}
    resultado: "prenderlo mide −$609 ± 308 / −$716 ± 324 / −$199 ± 442 según el prior"
    fecha: 2026-08-10
    vencida: >-
      Medida a 9.600 y producción corre 19.200. El NÚMERO probablemente aguanta (los 12
      goleadores están congelados y caen en el top-3 junto con el 84,6% del pool, así
      que los 25 pts son un desplazamiento casi común), pero su EXPLICACIÓN citaba "el
      mismo mecanismo que hace ganar al menú chico", y ese mecanismo se dio vuelta.
      Barata de re-medir; el premio esperado es chico.

  - nombre: umbral del aviso por valor del rerun
    donde: src.clausura.rerun_cierre.UMBRAL_SE
    valor: 2.0
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "avisar por diferencia de picks pedía 56 cambios hacia una planilla PEOR ($238k → $221k)"
    fecha: 2026-08-08
    nota: >-
      RE-MEDIDA el 2026-08-11 a 19.200 (scripts/backtest_umbral_aviso.py, 8 pares de
      rerun): la condición de ruido pide ~$517 así que el piso de $2.000 es el que manda.
      Los 8 reruns eran mejores (+$1.071 de media) y el piso suprimía 7 — pero la causa
      era el pulido del warm start, no el umbral: se resolvió subiendo max_passes a 6.
      El piso QUEDA en $2.000 para que el aviso vuelva a significar "pasó algo real".
      RE-CORRER el experimento tras unas fechas: si el rerun sigue encontrando ~$1.000,
      el pulido no se agota en 6 pasadas.

  - nombre: fallback de sorteos del rerun
    donde: src.clausura.rerun_cierre.DEFAULT_SIMS
    valor: 19200
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "no es una medición: tiene que seguir a producción"
    fecha: 2026-08-11
    nota: >-
      Quedó en 2.400 cuando producción pasó a 19.200 y se volvió activamente dañino: con
      K_EV=5 el menú de producción mide −$4.192 en ese régimen. Hay un test que lo ata al
      archivo de systemd para que no vuelva a envejecer en silencio.

  - nombre: ratings con partidos intra-temporada del Clausura
    donde: src.clausura.picks.ensure_ratings(extra=)
    valor: null
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "+0.0073 ± 0.0041 nats/partido (391 predicciones pareadas, walk-forward)"
    fecha: 2026-08-12
    nota: >-
      El default del parámetro es None; producción pasa partidos_clausura(cfg,
      resultados) — los jugados del propio torneo, construidos del config sin red.
      La auditoría del 12/8 encontró que el histórico estático termina en el
      Apertura y los ratings quedaban congelados pre-torneo TODA la temporada,
      mientras el backtest del decay refiteaba por fecha CON intra-temporada:
      medía un régimen que producción no ejecutaba. El efecto es 3.5x el decay
      rechazado, con la forma que predice el mecanismo (crece con las fechas
      acumuladas: +0.0045 en fechas 2-8 → +0.0096 en 9-15) y +1 pp de 1X2.
      NO usa Monte Carlo: mide calidad de predicción.
      Reproducir con scripts/backtest_ratings_intra.py.

  - nombre: ausentismo por fecha en el simulador
    donde: src.clausura.economics.SimConfig.show_por_fecha
    valor: false
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "Δ E[premio] −626 ± 1.359 (12 reps pareadas, 7/12 a favor) — NEUTRO"
    fecha: 2026-08-12
    nota: >-
      El HECHO es real y está medido en el snapshot de la F1 (727 filas): 630
      rivales (87%) cargaron los 7 partidos observables, contra el 56% de
      planillas completas que predice el Bernoulli independiente por partido
      (0.92⁷). Pero convertirlo en modelo no paga: en el experimento de
      recuperación (pool verdad con ausentismo por fecha, ambos brazos fitean el
      MISMO RivalModel y difieren solo en el sorteo de los futuros, 4 temporadas
      × 3 reps) el portfolio optimizado con show por fecha mide igual que el
      viejo. Coherente con el rechazo del 0-0 por paridad: refinar la FORMA del
      modelo del pool no se convierte en plata — el optimizador decide casi lo
      mismo. La perilla queda implementada y APAGADA. OJO: el harness corre a
      800 sims de optimización y 151 rivales (recuperación de modelo, no
      producción); si alguna vez se reconsidera, medir a escala de producción.
      Reproducir con scripts/backtest_show_fecha.py --reps 3.

  - nombre: premio grupo amigo fuera del objetivo
    donde: (nada — se decidió no modelarlo)
    valor: null
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "E[grupo amigo] = $0 hoy: no estamos en ningún grupo"
    fecha: 2026-08-12
    inerte: >-
      No es un descuido. Cláusula c) del reglamento (leída 12/8): premio $3.000
      POR GRUPO, todo-o-nada al mejor del grupo, desempate por exactos y después
      sorteo — SIN el reparto del Art. 7a. ACTUALIZADO 12/8 de noche: entra UNA
      participación por grupo (no las 12 juntas — verificado en la web) y
      tenemos 3 metidas en grupos de terceros de ~13/~21/13 participaciones
      (899258854/55/56). EV ≈ $230 por grupo de 13 → ~$700 total hoy: dos
      órdenes de magnitud debajo del objetivo ($500k), y la serie de
      refinamientos medidos NEUTROS (ausentismo, 0-0, hueco) dice que un término
      así no mueve picks — el pick de esas participaciones ya sirve al objetivo
      global. Se excluye del optimizador a sabiendas. Palanca operativa que SÍ
      paga: meter las otras 9 participaciones en grupos CHICOS (~$150-300 de EV
      cada una, gratis). Re-evaluar el modelado solo si las 12 quedan en grupos
      y el EV agregado supera ~$3.000.

  - nombre: prior de encogimiento para ascendidos
    donde: (nada — se midió y no se cambió)
    valor: null
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "debutantes walk-forward: +0.089 ± 0.091 goles a favor, −0.082 ± 0.094 en contra vs lo predicho"
    fecha: 2026-08-12
    inerte: >-
      No se cambió nada: la entrada documenta un rechazo. La premisa de la
      auditoría era que los ascendidos rinden bajo la media y el ridge (que
      encoge hacia la media de la liga) los sobrestima — Albion con P(campeón)
      4.4% arriba de Racing parecía el síntoma. El residuo walk-forward dice lo
      CONTRARIO: en su torneo de debut (cohortes 2025 y 2026, 156
      partidos-equipo) los debutantes hacen levemente MÁS goles y reciben
      levemente MENOS que lo que el modelo frío predice — ambos dentro del
      ruido. Un prior de encogimiento hacia abajo habría empeorado. Sin señal no
      hay perilla; el encogimiento a la media que ya hace el ridge es, si algo,
      levemente pesimista. Re-medir con la cohorte 2027 si el sistema sigue.
      Reproducir con scripts/backtest_ascendidos.py.

  - nombre: decay temporal de los ratings
    donde: src.clausura.ratings.fit_ratings(half_life_dias=)
    valor: null
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "365d mide +0.0021 ± 0.0026 nats/partido (t=0.81); 270d t=0.59; 120d negativo"
    fecha: 2026-08-12
    nota: >-
      Medido walk-forward sobre 528 predicciones, refitteando antes de cada fecha como
      hace producción. La premisa era buena —el ES solo publica cuotas de la fecha
      próxima, así que 112 de 120 eventos y todo P(campeón) son 100% ratings— pero el
      efecto no es significativo y mejora apenas el 53% de los partidos. La curva tiene
      forma sensata (meseta 270-365, se degrada en 120), que es lo único que sugiere
      señal. Referencia de escala: la calibración del pool movió 0.106 nats, 50x más.
      NO usa Monte Carlo: mide calidad de predicción, no E[premio]. Re-medir si
      aparecen más temporadas. Reproducir con scripts/backtest_ratings_decay.py.

  - nombre: sesgo del 0-0 según paridad del partido
    donde: (nada — se midió y no se cambió)
    valor: null
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "ajustarlo por paridad EMPEORA la log-loss fuera de muestra: 2.2811 → 2.2825"
    fecha: 2026-08-12
    inerte: >-
      No se cambió nada: la entrada documenta un rechazo. La hipótesis (auditoría
      externa) era que el factor del 0-0 varía ~16x según lo parejo del partido. La
      VARIACIÓN es real —17,7x sobre 8 partidos— pero NO la explica la paridad: Torque
      vs Peñarol y Danubio vs Cerro tienen desbalance idéntico (0.20) y ratios 0.04 vs
      0.66, 16x de diferencia. Ese par solo explica casi todo el rango. Ajustar por
      paridad aprende ruido y pierde fuera de muestra. Además, con chalk=2.2 el
      cociente Q/p del 0-0 YA varía 2,5x, así que parte de los 16x estaba cubierta.
      Coherente con que la tabla de 36 sesgos midiera EMPATE en E[premio]: refinar la
      FORMA de la Q no se convierte en plata con tan pocos partidos. RE-MEDIR con ~40
      partidos, cuando la paridad pueda separarse del ruido.
      Reproducir con scripts/calibrar_cero_cero.py.

  - nombre: sorteos de P(campeón) del prior del pool
    donde: src.clausura.especiales.p_campeon_from_grids(n_sims=)
    valor: 30000
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "3.000 → ±0,85 pp entre semillas en el líder (0,04 s) · 30.000 → ±0,24 pp (0,36 s)"
    fecha: 2026-08-12
    nota: >-
      No es una decisión de estrategia: es error de Monte Carlo comprado a precio de
      0,3 s en un pipeline de ~6 min. Medido EN EL DROPLET con 6 semillas. Importa
      porque P(campeón) no tiene mercado que la ancle —no existe outright del
      campeonato uruguayo en ninguna casa— y con 25 pts en juego por el especial, ±0,85
      pp de ruido en un equipo de 31% es ruido que no hace falta tener. El transitorio
      (120×30.000 int64 ≈ 29 MB) se libera antes de construir el simulador grande, así
      que no toca el pico de 590 MB medido el 12/8. Subir más no aporta: la dispersión
      ya está debajo de cualquier umbral que cambie una decisión.

  - nombre: γ de los rivales fiteado contra la Q blendeada
    donde: (nada — se midió y no se cambió)
    valor: null
    medida_con: {sims: 19200, participaciones: 12}
    resultado: "leave-one-out mueve γ −0,0127 en promedio; 90 de 726 rivales cambian de valor"
    fecha: 2026-08-12
    inerte: >-
      No se cambió nada: la entrada documenta un rechazo. La auditoría marcó
      circularidad —`pool_qs` se blendea con los picks observados y después se fitea γ
      de cada rival contra ESA Q, o sea que el pick del rival se explica en parte con
      él mismo— y proponía fitear contra la Q prior (pre-blend).
      DOS RAZONES PARA NO HACERLO. (1) Rompería la consistencia fit/muestreo: el MISMO
      `pool_qs` que se usa para fitear γ es el que después usa el simulador para
      sortear picks futuros (picks.py:919 y :960). Fitear contra el prior y muestrear
      con la blendeada haría que γ signifique "desvío del prior del modelo" y se aplique
      como "desvío de la distribución empírica del pool". Esa inconsistencia es de
      primer orden; la circularidad es de segundo.
      (2) Medido en el snapshot REAL (726 rivales, leave-one-out por rival): γ pasa de
      media 1,1006 a 1,0879, mediana idéntica (1,0690), y solo 90 rivales cambian de
      valor. OJO: el sesgo va en la dirección CONTRARIA a la que decía la auditoría —el
      fit contaminado INFLA γ (el pool parece más chalk de lo que es), no lo encoge
      hacia 1. Coherente con el mecanismo: si la Q ya contiene el pick del rival, ese
      pick tiene Q más alta y el rival parece más concentrado en el modo.
      Un leave-one-out de verdad cuesta recomputar la Q por rival y por partido (726x),
      y el efecto sobre E[premio] no está medido ni tiene signo obvio. Si alguna vez se
      retoma, medir E[premio] pareado — no la magnitud de γ, que ya sabemos que es 1,2%.
  - nombre: cobertura de desenlace en el menú
    donde: src.clausura.strategy.K_COBERTURA
    valor: false
    medida_con: {sims: 19200, participaciones: 12}
    resultado: >-
      E[premio] +153 ± 499 / +450 ± 732 (neutro en las dos verdades); contra las 4
      temporadas REALES caza 4/37 batacazos y cuesta 6 pts de mejor planilla
    fecha: 2026-08-12
    nota: >-
      El hallazgo estructural es REAL: en partidos desparejos el mejor marcador de
      visitante queda ~puesto 19 por E[pts] y las 12 participaciones salen sin ninguno
      (la F1 realizó eso: 3 batacazos, 0/12). Y el optimizador SÍ toma los candidatos
      de cobertura cuando se le ofrecen (a diferencia de la rama de hueco, que ofrecía
      5-1/5-0 y quedó intacta: (5,3) ≡ (5,0) bit a bit). Pero el seguro no funciona:
      ~20 pólizas sobre 113 partidos cubren el 18% de los batacazos, no los batacazos
      — en la realidad cazó 4/37 y costó puntos y premio. Para cazarlos de verdad
      habría que asegurar la mayoría de los partidos, y esos boletos salen carísimos.
      La Fecha 1 fue frecuencia normal (~10 batacazos/temporada), no modelo roto.
      K_COBERTURA queda implementado y APAGADO. Reproducir:
      scripts/backtest_cobertura.py --etapa 1|2|3.

  - nombre: warm start desde la planilla previa
    donde: src.clausura.picks.run(usar_warm_start=)
    valor: true
    medida_con: {sims: 2400, participaciones: 12, max_passes: 3}
    resultado: "+$3.622 ± 699 de E[premio] y churn de picks 49% → 22%"
    fecha: 2026-08-08
    vencida: >-
      Medida a 2.400 sorteos y max_passes=3; producción corre 19.200 y 6 pasadas. Se
      deja VENCIDA a la vista en vez de re-medirla de una: el brazo "frío" de esa
      medición cuesta una corrida completa por réplica, y el mismo contraste se está
      obteniendo gratis en continuo con src.clausura.cold_check (una corrida fría por
      semana, comparada con sorteos comunes). Si el cold_check acumula fechas sin que
      la fría gane nunca, eso ES la re-medición y acá se actualiza `medida_con`.
    nota: >-
      La auditoría del 13/8 encontró que esta decisión NUNCA se había registrado, y es
      la que más lo necesitaba: se midió con max_passes=3 y 2.400 sorteos, y hoy
      producción corre 6 pasadas y 19.200. La propia entrada de max_passes dice que
      "warm start + 3 pasadas ≡ 6 pasadas en frío", así que con 6 pasadas el valor
      marginal en E[premio] es una INCÓGNITA (el beneficio de churn sí sobrevive: menos
      recargas manuales por saltos entre óptimos equivalentes).
      Riesgo estructural aparte del nivel: el ascenso hereda la columna entera y solo la
      reemplaza si un candidato del menú de HOY la supera — un pick heredado nunca se
      compara contra "¿entrarías al menú desde cero?", así que puede sobrevivir
      indefinidamente. La cadena lleva ~10 generaciones y el gate del rerun compara warm
      nueva vs warm vigente, dos habitantes del mismo pozo.
      Por eso NO se re-mide acá sino que se vigila en continuo: src.clausura.cold_check
      corre el pipeline en frío una vez por semana y avisa si le gana a la cadena por
      >2·SE y >$2.000 (mismo doble umbral del gate). Reproducir a mano:
      python -m src.clausura.cold_check --dry-run
