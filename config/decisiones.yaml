  - nombre: dependencia entre goles en las grillas de ratings (λ12 / Dixon-Coles)
    donde: (nada — se midió y no se cambió)
    valor: null
    medida_con: {sims: 19200, participaciones: 12}
    resultado: >-
      bivariate λ12 −0.00124 ± 0.00507 nats/partido (t=−0.24) · Dixon-Coles ρ
      −0.00266 ± 0.00205 (t=−1.30), 528 partidos walk-forward; empate real 27,46%
      vs 26,92% del Poisson independiente
    delta: -0.00124
    se: 0.00507
    unidad: nats
    fecha: 2026-08-13
    inerte: >-
      No se cambió nada: la entrada documenta un rechazo y, sobre todo, CIERRA una
      contradicción que el sistema venía sosteniendo sin saberlo.
    nota: >-
      LA CONTRADICCIÓN (auditoría 13/8): en los 8 partidos con mercado,
      `market_lambdas` fitea un λ12 libre y lo propaga al blend (dependencia
      positiva); en los otros 112 —y en el 100% de P(campeón)— `ratings.py` usa
      λ12 = 0 citando "corr +0.002". Las dos no pueden ser ciertas.
      SE MIDIERON DOS MODELOS, porque la correlación de Pearson ≈ 0 refuta la
      bivariada pero NO la otra forma de dependencia: Dixon-Coles reajusta solo los
      cuatro marcadores bajos y puede subir la diagonal dejando la correlación
      intacta. Walk-forward por fecha (ratings y parámetro extra fiteados sobre lo
      ANTERIOR), evaluando la verosimilitud del marcador exacto.
      RESULTADO: ninguno mejora fuera de muestra, y el Poisson independiente
      CALIBRA MEJOR el empate que los dos (26,92% vs 27,46% real, dentro de ±1,94
      pp de error; la bivariada se pasa a 28,98%). El 0-0 sí queda 1,4 pp corto con
      el independiente (9,35% vs 10,80% real), pero es ~1 SE y la bivariada lo
      arregla al precio de inflar TODOS los empates.
      El lado ratings queda VALIDADO: λ12 = 0 ahora está medido, no supuesto.
      SOBRE LA POTENCIA: el brazo de verosimilitud es ciego a efectos menores a
      0,0144 nats (bivariada) y 0,0058 (Dixon-Coles), y la ingesta intra-temporada
      —adoptada— valió 0,0073. O sea que el log-lik NO descarta un efecto del
      tamaño que nos importa; lo que sí es evidencia dura es la calibración, donde
      el independiente ya es el mejor de los tres y no hay nada que arreglar.
      LO QUE ABRE: del lado MERCADO, λ12 no es una creencia sobre dependencia sino
      el tercer grado de libertad que el fit necesita para clavar las tres patas
      del 1X2. Reporta λ12 > 0 siempre que el mercado pida más empate del que
      implican sus marginales — esperable con 14,7% de overround (el empate de
      Supermatch viene +0,53 pp vs Pinnacle, medido el 13/8). Sospecha razonable:
      ese λ12 absorbe vig, no estructura. Cambiarlo exige Δ E[premio] pareado.
      Control que hace informativo al nulo: el fit RECUPERA un λ12 sembrado
      (0,25 → 0,25 ± 0,06) y devuelve ~0 cuando no hay dependencia (tests).
      Reproducir con scripts/backtest_lambda12.py.

  - nombre: warm start desde la planilla previa
    donde: src.clausura.picks.run(usar_warm_start=)
    valor: true
    medida_con: {sims: 2400, participaciones: 12, max_passes: 3}
    resultado: "+$3.622 ± 699 de E[premio] y churn de picks 49% → 22%"
    delta: 3622
    se: 699
    unidad: pesos
    fecha: 2026-08-08
    vencida: >-
      Medida a 2.400 sorteos y max_passes=3; producción corre 19.200 y 6 pasadas. Se
      deja VENCIDA a la vista en vez de re-medirla de una: el brazo "frío" de esa
      medición cuesta una corrida completa por réplica, y el mismo contraste se está
      obteniendo gratis en continuo con src.clausura.cold_check (una corrida fría por
      semana, comparada con sorteos comunes). Si el cold_check acumula fechas sin que
      la fría gane nunca, eso ES la re-medición y acá se actualiza `medida_con`.
    nota: >-
      La auditoría del 13/8 encontró que esta decisión NUNCA se había registrado, y es
      la que más lo necesitaba: se midió con max_passes=3 y 2.400 sorteos, y hoy
      producción corre 6 pasadas y 19.200. La propia entrada de max_passes dice que
      "warm start + 3 pasadas ≡ 6 pasadas en frío", así que con 6 pasadas el valor
      marginal en E[premio] es una INCÓGNITA (el beneficio de churn sí sobrevive: menos
      recargas manuales por saltos entre óptimos equivalentes).
      Riesgo estructural aparte del nivel: el ascenso hereda la columna entera y solo la
      reemplaza si un candidato del menú de HOY la supera — un pick heredado nunca se
      compara contra "¿entrarías al menú desde cero?", así que puede sobrevivir
      indefinidamente. La cadena lleva ~10 generaciones y el gate del rerun compara warm
      nueva vs warm vigente, dos habitantes del mismo pozo.
      Por eso NO se re-mide acá sino que se vigila en continuo: src.clausura.cold_check
      corre el pipeline en frío una vez por semana y avisa si le gana a la cadena por
      >2·SE y >$2.000 (mismo doble umbral del gate). Reproducir a mano:
      python -m src.clausura.cold_check --dry-run

  - nombre: recargar los picks de cada día con la corrida de ESE día
    donde: (nada — rechazo, la rutina de carga queda libre)
    valor: "cargar todo junto está bien"
    medida_con: {sims: 19200, participaciones: 12, escenarios: 10, seeds_eval: 8}
    resultado: "+$139 ± 50 de E[premio] (8/10 escenarios positivos)"
    delta: 139
    se: 50
    unidad: pesos
    fecha: 2026-08-15
    nota: >-
      LA PREGUNTA (del usuario, 15/8): una fecha se juega viernes-domingo. ¿Conviene
      cargar los partidos del domingo con la planilla del domingo a la mañana —que ya
      sabe los resultados del sábado— en vez de cargar todo el viernes?
      HIPÓTESIS, que resultó FALSA en magnitud: como el objetivo es E[premio] y no
      puntos, depende de dónde estamos parados; después del sábado cambia la distancia
      al líder y con ella cuánto conviene diferenciarse el domingo. Se esperaba que
      fuera el canal grande.
      MEDICIÓN (scripts/backtest_recarga_diaria.py, F2 real: día 1 = los 4 del sábado
      sorteados, día 2 = los 3 del domingo). Tres brazos bajo la MISMA verdad
      condicionada y sorteos comunes: A = planilla del viernes; B0 = re-optimiza el
      domingo con warm start pero SIN saber el sábado (control de pulido); Bs = lo
      mismo pero con el sábado ya resuelto. El control B0 es lo que hace interpretable
      el número: sin él, el pulido de las pasadas extra se le atribuiría a la
      información. Δ información = Bs−B0.
      RESULTADO: +$139 ± 50, 8/10 positivos. Estadísticamente distinto de cero
      (2,8·SE) pero DESPRECIABLE: mde_80 = $143, muy por debajo del piso de acción de
      $2.000, o sea que la medición estaba bien potenciada y el efecto es chico de
      verdad — no es un "no pude ver nada". El pulido salió +$21 ± 45 (nulo), coherente
      con que acá solo se re-optimizan 3 partidos.
      CONSECUENCIA OPERATIVA: la rutina de carga es libre. Cargar todo el viernes de
      una es correcto; no hay que levantarse temprano cada día. Y para comparar: el
      MISMO día se midió que el pulido del rerun vale +$715 (ver 'umbral del aviso por
      valor'), o sea 5× más que la información de un día entero de resultados. La plata
      del sistema está en optimizar mejor, no en cargar más tarde.
      RE-MEDIR si cambia el tamaño del pool o si el campeonato entra en una fase donde
      la tabla esté apretada arriba (medido con nosotros en el puesto 58 de 747 y a 17
      puntos del líder; el canal debería crecer si estuviéramos peleando el tope).
